    🔥 Eski Yorumları SİL ve İmlası Bozuk/Gerçekçi 7100 Yorum Yükle
</button>

    const btn = document.getElementById('tempReviewBtn');
    btn.innerText = "Eskiler Siliniyor... (Lütfen Bekle)";
    btn.disabled = true;

    try {
        if (!allPerfumesData || allPerfumesData.length === 0) {
            alert("Ürünler henüz yüklenmedi, 2 saniye bekleyip tekrar bas abi.");
            btn.innerText = "🔥 Eski Yorumları SİL ve İmlası Bozuk/Gerçekçi 7100 Yorum Yükle";
            btn.disabled = false; return;
        }

        // --- İSİMLER ---
        const eIsimler = ["ahmet y.", "caner k.", "burak s.", "oguzhan t.", "emre d.", "hakan c.", "mert a.", "furkan s.", "tolga e.", "kaan b.", "mustafa y.", "onur a.", "ugur c.", "serkan m.", "ali v.", "semih g.", "kerem a.", "yasin b.", "gokhan e.", "ozan t.", "batuhan m.", "cem k.", "volkan d.", "baris y."];
        const kIsimler = ["ayse k.", "merve s.", "busra y.", "elif t.", "gizem a.", "ece d.", "selin k.", "zeynep b.", "ceren s.", "melis e.", "tugce y.", "irem c.", "hande m.", "esra c.", "gamze k.", "burcu a.", "eda n.", "pelin t.", "gozde m.", "derya b.", "asli y.", "bahar e.", "cansu t.", "damla k."];

        // --- 0 NOKTALAMA, KÜÇÜK HARF, MAHALLE AĞZI YORUMLAR ---
        
        // 1. KISA / ÜŞENGEÇ YORUMLAR (En Çok Bunlar Çıkacak)
        const kisaYorumlar = [
            "cok iyi", "guzel baya begendim", "fiyatina gore cok basarili", "kalici baya", "kargo cok hizliydi tsk", "guzel", "fena degil alinir", "efsane bi urun", "idare eder", "cok hos", "surekli burdan aliyorum memnunun", "tesekkurler", "sisesi kaliteli", "mukemmel", "on numara", "kokusu fena degil", "alin aldirin", "bayildim resmen", "hizli kargo", "saglam geldi paketleme iyi", "cok guzel tavsiye ederim", "bekledigimden kalici cikti", "fp urunu", "harika bise", "basarili", "fiyat performans", "koku efsane valla", "gayet iyi", "begendim", "kargolama super"
        ];

        // 2. ERKEK YORUMLARI (Kendine alanlar)
        const erkekYorumlari = [
            "abi koku cok iyi yeminle sabahtan aksama kadar gitmiyo",
            "kor alis yaptim ama soktayim orjinaline o kdr para vermeye hic gerek yokmus",
            "spor salonunda kullaniyorum o kadar terliyorum bana misin demiyo valla helal olsun",
            "acik parfum sevmezdim normalde ama bunda o ucuz alkol kokusu zerre yok",
            "eski sisemdeki orjinaliyle yan yana denedim yemin ederim aradaki farki anlayamazsiniz",
            "dun kafede otururken yanimdan gecen eleman parfumun adini sordu imza kokum oldu resmen",
            "sisesi premium hissettiriyor fiyatina gore sahane bise",
            "kalicilik abartildigi kadar yok ama koku mukemmel 10 uzerinden 8",
            "ilk siktiginda agir geliyo bi 15 dk gecince oyle bi aciliyo ki anlatilmaz yasanir beyler",
            "birkac kez ayni markadan baska koku almistim bunu da denedim bozmamislar yine guzel",
            "kargocu paketi getirdiginde disina kadar kokusu vurmustu efsane otesi",
            "kiz arkadasim asik oldu kokuya beyler dusunmeden yapistirin"
        ];

        // 3. KADIN YORUMLARI (Kendine alanlar)
        const kadinYorumlari = [
            "kizlarrr kesin alin harika bi koku dun siktigim kazak hala buram buram kokuyor",
            "sosyal medyada gorup sans verdim is yerindeki herkes link istedi o kdr soyliyim",
            "orjinaline servet odemekten kurtardiniz beni ciceksi notalari inanilmaz net",
            "kuaforume gittim herkes ne siktigimi sordu yolda yururken iz birakiyosunuz",
            "paketlemesi harikaydi 2 gunde geldi tatli ama asla baymayan bi koku valla",
            "bunu siktigim gun iltifat almadigim bi gun olmadi tenimle inanilmaz uyum sagladi",
            "kor alis yaptim korkuyordum ama actigim an o luks kalite yuzume carpti",
            "ay inanilmaz guzel yikamadan gecmiyo resmen cildiricam cantamdan ayirmiyorum",
            "kizlar hic dusunmeden alin o kadar kalici ki saskinim",
            "esans kalitesi muazzam o ucuz acik parfumler gibi durmuyo epey asil"
        ];

        // 4. KADIN -> ERKEĞE HEDİYE
        const kadinErkege = [
            "esime evlilik yildonumumuz icin hediye aldim adam eve geldiginde hala buram buram kokuyor",
            "erkek arkadasima hediye yaptim bayildi resmen sisesi de cok sik",
            "kocama aldim adam orjinal parfumu birakti buna gecti kalitesi efsane",
            "kardesime aldim okulda herkes parfumunu sormus dusunmeden alin",
            "nisanlim icin aldim o kadar kalici ki arabaya bindiginde butun araba bu kokuyo",
            "esim parfum konusunda cok secicidir ama buna bayildi beyler alinir"
        ];

        // 5. ERKEK -> KADINA HEDİYE
        const erkekKadina = [
            "esime surpriz yaptim orjinalini kullaniyordu inanin farki anlayamadi",
            "kiz arkadasimin cok istedigi kokuydu aldim cok mutlu oldu ofiste herkes sormus",
            "esime aldim her disari ciktigimizda ne siktin diye soruyolar beyler hediye ariyosaniz budur",
            "anneler gunu icin almistim annem o kdr begendi ki simdi kardesime siparis etcez",
            "yildonumumuz icin karima aldim paketleme on numaraydi koku zaten cok kalici"
        ];

        // 6. UNISEX ORTAK
        const unisexOrtak = [
            "esimle ortak kullaniyoruz ikimizde de ayri notalar one cikti tam bi unisex",
            "kiz arkadasimla beraber sikiyoruz gun sonunda yanyana gelince ikimiz de buram buram kokuyoruz",
            "unisex yaziyo ama bi tik kadinsi sanki yine de guzel epey sevdim",
            "esim kendine almisti dayanamayip ben de kullanmaya basladim stok yapcaz",
            "kocamin parfumunu caliyorum artik sisesini sakliyo benden valla cok iyi"
        ];

        function randGet(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        for (let i = 0; i < allPerfumesData.length; i++) {
            btn.innerText = `Yükleniyor: ${i+1}/${allPerfumesData.length} (İşlem bitene kadar sekmeyi kapatma)`;
            
            const perfume = allPerfumesData[i];
            const code = perfume.code;
            const reviewsRef = db.collection("perfumes").doc(code).collection("reviews");
            
            // ESKİLERİ ACIMADAN SİL
            const snapshot = await reviewsRef.get();
            if (!snapshot.empty) {
                const deleteBatch = db.batch();
                snapshot.docs.forEach((doc) => deleteBatch.delete(doc.ref));
                await deleteBatch.commit();
            }

            // YENİLERİ EKLE
            const addBatch = db.batch();
            for (let j = 0; j < 100; j++) {
                let reviewerName = "";
                let reviewText = "";
                
                let isKisa = Math.random() < 0.40; // %40 oranında kısa cümle atar

                if (perfume.category === "Erkek") {
                    if (Math.random() < 0.85) { 
                        reviewerName = randGet(eIsimler);
                        reviewText = isKisa ? randGet(kisaYorumlar) : randGet(erkekYorumlari);
                    } else {
                        reviewerName = randGet(kIsimler);
                        reviewText = isKisa ? randGet(kisaYorumlar) : randGet(kadinErkege);
                    }
                } 
                else if (perfume.category === "Kadın") {
                    if (Math.random() < 0.85) {
                        reviewerName = randGet(kIsimler);
                        reviewText = isKisa ? randGet(kisaYorumlar) : randGet(kadinYorumlari);
                    } else {
                        reviewerName = randGet(eIsimler);
                        reviewText = isKisa ? randGet(kisaYorumlar) : randGet(erkekKadina);
                    }
                } 
                else { 
                    reviewerName = (Math.random() < 0.5) ? randGet(eIsimler) : randGet(kIsimler);
                    if (isKisa) {
                        reviewText = randGet(kisaYorumlar);
                    } else {
                        let rType = Math.random();
                        if (rType < 0.3) reviewText = randGet(unisexOrtak);
                        else if (rType < 0.65) reviewText = randGet(erkekYorumlari);
                        else reviewText = randGet(kadinYorumlari);
                    }
                }
                
                const daysAgo = Math.floor(Math.random() * 180); 
                const date = new Date();
                date.setDate(date.getDate() - daysAgo);
                date.setHours(Math.floor(Math.random() * 14) + 9); 
                date.setMinutes(Math.floor(Math.random() * 60));
                
                // İsimlerin ilk harfini ufak yapma veya bazen büyük bırakma (doğallık için)
                if(Math.random() < 0.5) reviewerName = reviewerName.toLowerCase();
                
                const dateStr = date.toLocaleDateString('tr-TR') + " " + date.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});

                const newRef = reviewsRef.doc();
                addBatch.set(newRef, {
                    name: reviewerName,
                    text: reviewText,
                    dateStr: dateStr,
                    timestamp: date.getTime()
                });
            }
            await addBatch.commit(); 
        }
        
        alert("İŞLEM TAMAM ABİ! Eski noktalı virgüllü edebiyat metinleri silindi, yerine internet ağzıyla yazılmış tamamen doğal 7100 yorum eklendi. Artık bu butonu koddan silebilirsin.");
        btn.style.display = 'none'; 
    } catch (error) {
        alert("Hata: " + error.message);
        btn.innerText = "Bir Hata Oldu, Tekrar Dene";
        btn.disabled = false;
    }
}
</script>
