<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vi Marélli | Koku Ansiklopedisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* BEYAZ/AÇIK TEMA RENKLERİ */
        :root {
            --bg-main: #fcfcfc;
            --panel-bg: #ffffff;
            --gold: #C5A033; 
            --gold-dim: rgba(197, 160, 51, 0.15);
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #eaeaea;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: 'Montserrat', sans-serif; line-height: 1.6;
        }

        h1, h2, h3, .brand-text { font-family: 'Playfair Display', serif; }

        /* Navigasyon */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; background: #ffffff;
            border-bottom: 2px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .brand-logo { width: 50px; height: auto; }
        .brand-text { font-size: 32px; color: var(--text-main); font-weight: 700; letter-spacing: 2px; }

        .search-box {
            display: flex; border: 1px solid var(--border-color);
            border-radius: 25px; overflow: hidden; background: var(--bg-main);
        }
        .search-box input {
            background-color: transparent; border: none; padding: 10px 20px;
            width: 300px; color: var(--text-main); font-family: 'Montserrat', sans-serif;
        }
        .search-box input:focus { outline: none; background-color: #f0f0f0; }
        .search-box button {
            background-color: var(--gold); border: none; padding: 0 20px;
            cursor: pointer; color: #fff; transition: 0.3s;
        }

        /* Reklam Alanları */
        .ad-space {
            background-color: #f9f9f9; border: 1px dashed #ccc;
            display: flex; align-items: center; justify-content: center;
            color: #999; font-size: 14px; letter-spacing: 1px;
        }
        .top-ad { width: 100%; max-width: 728px; height: 90px; margin: 30px auto; }
        .side-ad { width: 100%; height: 250px; margin-bottom: 30px; }

        .main-wrapper { max-width: 1300px; margin: 0 auto 50px; padding: 0 5%; }

        /* Vitrin Görünümü */
        .catalog-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px; margin-top: 20px;
        }
        .perfume-card {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 15px; text-align: center;
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .perfume-card:hover {
            transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            border-color: var(--gold);
        }
        .perfume-card img {
            width: 100%; height: 220px; object-fit: cover;
            border-radius: 5px; margin-bottom: 15px; background: #f5f5f5;
        }
        .perfume-card h4 { font-size: 16px; color: var(--text-main); margin-bottom: 5px; }
        .perfume-card .card-category { font-size: 12px; color: var(--text-muted); margin-bottom: 10px;}
        .perfume-card .card-code { color: var(--gold); font-weight: 600; font-size: 18px;}

        /* Detay Görünümü */
        .back-button {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: 600;
            margin-bottom: 30px; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-button:hover { background: var(--gold); color: #fff; }

        .fragrance-container { display: grid; grid-template-columns: 350px 1fr 300px; gap: 40px; }

        .image-showcase {
            background-color: var(--panel-bg); border-radius: 10px; border: 1px solid var(--border-color);
            text-align: center; margin-bottom: 20px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        
        .rating-box {
            background-color: var(--panel-bg); padding: 20px; border-radius: 10px;
            border: 1px solid var(--border-color); text-align: center;
        }
        .score-display { font-size: 36px; font-weight: 700; color: var(--gold); font-family: 'Playfair Display', serif; }
        .score-display span { font-size: 18px; color: var(--text-muted); }
        .stars { margin: 15px 0; font-size: 24px; cursor: pointer; color: #ddd; }
        .stars i.fas { color: var(--gold); }

        .perfume-name { font-size: 42px; color: var(--text-main); margin-bottom: 5px; }
        .perfume-brand { font-size: 20px; color: var(--gold); margin-bottom: 25px; font-style: italic; }
        
        .description { font-size: 16px; color: #555; margin-bottom: 40px; text-align: justify; }

        .notes-pyramid {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 30px; margin-bottom: 30px;
        }
        .notes-pyramid h3 {
            color: var(--gold); font-size: 22px; margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
        }
        .note-items { display: flex; flex-wrap: wrap; gap: 10px; }
        .note {
            display: flex; align-items: center; background-color: var(--bg-main);
            border: 1px solid #ddd; padding: 8px 15px; border-radius: 30px;
            font-size: 14px; font-weight: 500; color: #444;
        }

        /* Yorum Alanı Tasarımı */
        .reviews-section {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 30px; margin-bottom: 30px;
        }
        .reviews-section h3 { font-size: 22px; color: var(--text-main); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;}
        
        .review-list { margin-bottom: 25px; max-height: 400px; overflow-y: auto; }
        .review-item { border-bottom: 1px solid #eee; padding: 15px 0; }
        .review-item:last-child { border-bottom: none; }
        .review-item h5 { font-size: 15px; color: var(--gold); margin-bottom: 5px; }
        .review-item p { font-size: 14px; color: #555; }
        .review-item .date { font-size: 11px; color: #999; }

        .add-review-box { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        .add-review-box input, .add-review-box textarea {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd;
            border-radius: 5px; font-family: 'Montserrat', sans-serif;
        }
        .add-review-box textarea { resize: vertical; min-height: 80px; }
        .add-review-box button {
            background-color: var(--text-main); color: #fff; border: none;
            padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: 600;
            transition: 0.3s;
        }
        .add-review-box button:hover { background-color: var(--gold); }

        .right-sidebar { display: flex; flex-direction: column; gap: 30px; }
        .similar-perfumes {
            background-color: var(--panel-bg); padding: 25px; border-radius: 10px;
            border: 1px solid var(--border-color); text-align: center;
        }

        @media (max-width: 1024px) {
            .fragrance-container { grid-template-columns: 1fr; }
            .right-sidebar { display: flex; flex-direction: row; gap: 20px; }
            .side-ad, .similar-perfumes { flex: 1; margin-bottom: 0; }
        }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 15px; }
            .right-sidebar { flex-direction: column; }
            .catalog-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="image/logo.png" alt="Vi Marélli" class="brand-logo" onerror="this.style.display='none'">
            <span class="brand-text">Vi Marélli</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Parfüm, nota veya kod ara...">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <div class="ad-space top-ad">
        <span>[728x90] Premium Reklam Alanı</span>
    </div>

    <main class="main-wrapper" id="main-container">
        <!-- İçerik -->
    </main>

    <script>
        let allPerfumesData = [];
        const container = document.getElementById("main-container");
        const searchInput = document.getElementById("searchInput");

        document.addEventListener("DOMContentLoaded", function() {
            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    allPerfumesData = data;
                    renderCatalog(data); 
                })
                .catch(error => {
                    container.innerHTML = `<h2 style="text-align:center; margin-top:50px;">Ürünler yüklenemedi. Lütfen data.json dosyanızı kontrol edin.</h2>`;
                });

            searchInput.addEventListener("input", function() {
                const term = this.value.toLowerCase().trim();
                const filtered = allPerfumesData.filter(p => 
                    p.name.toLowerCase().includes(term) || 
                    (p.keywords && p.keywords.toLowerCase().includes(term)) ||
                    (p.code && p.code.includes(term))
                );
                renderCatalog(filtered);
            });
        });

        function renderCatalog(perfumes) {
            if (perfumes.length === 0) {
                container.innerHTML = `<h3 style="text-align:center; padding: 50px;">Aradığınız parfüm bulunamadı.</h3>`;
                return;
            }
            let html = `<div class="catalog-grid">`;
            perfumes.forEach(p => {
                html += `
                    <div class="perfume-card" onclick="showDetail('${p.code}')">
                        <img src="image/${p.code}.jpg" alt="${p.name}" onerror="this.src='image/logo.png'">
                        <h4>${p.name.split('-')[0].trim()}</h4>
                        <div class="card-category">${p.category}</div>
                        <div class="card-code">#${p.code}</div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        window.showDetail = function(code) {
            const perfume = allPerfumesData.find(p => p.code === code);
            if(!perfume) return;

            // Puanı Tarayıcı Hafızasından (Local Storage) Çek
            let storedData = JSON.parse(localStorage.getItem('rating_' + code));
            let currentScore = 4.8;
            let totalVotes = 124; 
            
            if(storedData) {
                // Kullanıcı daha önce oy verdiyse ortalamayı sahte de olsa değiştirip göster
                currentScore = ((currentScore * totalVotes + parseInt(storedData.score)) / (totalVotes + 1)).toFixed(1);
                totalVotes += 1;
            }

            const html = `
                <button class="back-button" onclick="renderCatalog(allPerfumesData); document.getElementById('searchInput').value='';">
                    <i class="fas fa-arrow-left"></i> Tüm Parfümlere Dön
                </button>
                
                <div class="fragrance-container">
                    <aside class="fragrance-visual">
                        <div class="image-showcase">
                            <img src="image/${perfume.code}.jpg" alt="${perfume.name}" onerror="this.src='image/logo.png'" style="width: 100%; height: auto; display: block;">
                        </div>
                        
                        <div class="rating-box">
                            <h3 style="font-family:'Montserrat', sans-serif;">Kullanıcı Puanı</h3>
                            <div class="score-display" id="display-score">${currentScore} <span>/ 5</span></div>
                            <div class="stars star-rating" data-code="${perfume.code}" data-voted="${storedData ? 'true' : 'false'}">
                                <i class="${storedData && storedData.score >= 1 ? 'fas' : 'far'} fa-star" data-value="1"></i>
                                <i class="${storedData && storedData.score >= 2 ? 'fas' : 'far'} fa-star" data-value="2"></i>
                                <i class="${storedData && storedData.score >= 3 ? 'fas' : 'far'} fa-star" data-value="3"></i>
                                <i class="${storedData && storedData.score >= 4 ? 'fas' : 'far'} fa-star" data-value="4"></i>
                                <i class="${storedData && storedData.score >= 5 ? 'fas' : 'far'} fa-star" data-value="5"></i>
                            </div>
                            <p class="rating-status" style="font-size:13px; color:#666;">
                                ${storedData ? 'Oyunuz Kaydedildi' : totalVotes + ' Değerlendirme'}
                            </p>
                        </div>
                    </aside>

                    <section class="fragrance-details">
                        <h1 class="perfume-name">${perfume.name}</h1>
                        <h2 class="perfume-brand">Vi Marélli <span>${perfume.category}</span></h2>
                        
                        <div class="description"><p>${perfume.description}</p></div>
                        
                        <div style="margin-bottom: 40px;">
                             <a href="${perfume.redirectUrl}" target="_blank" style="background-color: var(--gold); color: #fff; padding: 15px 30px; text-decoration: none; font-weight: bold; font-size: 16px; border-radius: 5px; display: inline-block; transition: 0.3s; box-shadow: 0 4px 15px rgba(197, 160, 51, 0.3);">
                                Sipariş Ver / İncele
                             </a>
                        </div>

                        <div class="notes-pyramid">
                            <h3><i class="fas fa-layer-group"></i> Etiketler / Notalar</h3>
                            <div class="note-items">${generateKeywordsHTML(perfume.keywords)}</div>
                        </div>

                        <!-- YORUM ALANI -->
                        <div class="reviews-section">
                            <h3>Kullanıcı Yorumları</h3>
                            <div class="review-list" id="reviewList_${perfume.code}">
                                <!-- Yorumlar JavaScript ile buraya eklenecek -->
                            </div>
                            
                            <div class="add-review-box">
                                <h4 style="margin-bottom: 10px;">Deneyiminizi Paylaşın</h4>
                                <input type="text" id="reviewerName_${perfume.code}" placeholder="İsminiz">
                                <textarea id="reviewText_${perfume.code}" placeholder="Bu koku hakkında ne düşünüyorsunuz? Kalıcılığı ve yayılımı nasıldı?"></textarea>
                                <button onclick="addReview('${perfume.code}')">Yorumu Gönder</button>
                            </div>
                        </div>
                    </section>

                    <aside class="right-sidebar">
                        <div class="ad-space side-ad"><span>[300x250]<br>Sponsorlu İçerik</span></div>
                        <div class="similar-perfumes">
                            <h3 style="font-family:'Montserrat', sans-serif;">Koleksiyon Kodu</h3>
                            <div style="font-size: 48px; color: var(--gold); font-family: 'Playfair Display', serif; border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; background: #fafafa;">
                                #${perfume.code}
                            </div>
                        </div>
                    </aside>
                </div>
            `;
            
            container.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
            setupRatingSystem(perfume.code);
            loadReviews(perfume.code); // Yorumları yükle
        }

        function generateKeywordsHTML(keywordsString) {
            if (!keywordsString) return `<div class="note">Genel</div>`;
            const keywordsArray = keywordsString.split(',').map(kw => kw.trim()).filter(kw => kw.length > 0);
            let html = "";
            keywordsArray.slice(0, 8).forEach(kw => {
                const capitalizedKw = kw.charAt(0).toUpperCase() + kw.slice(1);
                html += `<div class="note"><span style="color:var(--gold); font-weight:bold; margin-right:5px;">#</span>${capitalizedKw}</div>`;
            });
            return html;
        }

        // Yıldız Oylama (Local Storage Destekli)
        function setupRatingSystem(code) {
            const container = document.querySelector(".star-rating");
            if(!container) return;
            const stars = container.querySelectorAll("i");
            const statusText = container.nextElementSibling; 
            const displayScore = document.getElementById("display-score");
            
            let hasVoted = container.getAttribute("data-voted") === "true";

            stars.forEach(star => {
                star.addEventListener("mouseover", function() { if(!hasVoted) highlight(stars, this.getAttribute("data-value")); });
                star.addEventListener("mouseout", function() { if(!hasVoted) highlight(stars, 0); });
                
                star.addEventListener("click", function() {
                    if(hasVoted) return; 
                    const rating = parseInt(this.getAttribute("data-value"));
                    hasVoted = true; 
                    highlight(stars, rating);
                    
                    // Sahte bir yeni ortalama hesapla ve ekrana bas
                    let newScore = ((4.8 * 124 + rating) / 125).toFixed(1);
                    displayScore.innerHTML = `${newScore} <span>/ 5</span>`;
                    statusText.innerHTML = `<span style="color: var(--gold); font-weight:bold;">${rating} Yıldız - Kaydedildi</span>`;
                    
                    // Tarayıcıya kaydet
                    localStorage.setItem('rating_' + code, JSON.stringify({score: rating}));
                });
            });
        }

        function highlight(stars, count) {
            stars.forEach(star => {
                if (star.getAttribute("data-value") <= count) star.classList.replace("far", "fas");
                else star.classList.replace("fas", "far");
            });
        }

        // Yorum Ekleme ve Yükleme Sistemi (Local Storage)
        window.loadReviews = function(code) {
            const reviewList = document.getElementById(`reviewList_${code}`);
            let comments = JSON.parse(localStorage.getItem(`comments_${code}`)) || [];
            
            if(comments.length === 0) {
                reviewList.innerHTML = `<p style="color:#888; font-style:italic; padding: 10px 0;">Henüz yorum yapılmamış. İlk değerlendiren siz olun!</p>`;
                return;
            }

            let html = "";
            // Yorumları yeniden eskiye dizmek için ters çeviriyoruz
            comments.slice().reverse().forEach(c => {
                html += `
                    <div class="review-item">
                        <h5>${c.name}</h5>
                        <p>${c.text}</p>
                        <span class="date">${c.date}</span>
                    </div>
                `;
            });
            reviewList.innerHTML = html;
        }

        window.addReview = function(code) {
            const nameInput = document.getElementById(`reviewerName_${code}`);
            const textInput = document.getElementById(`reviewText_${code}`);
            
            if(nameInput.value.trim() === "" || textInput.value.trim() === "") {
                alert("Lütfen isminizi ve yorumunuzu girin.");
                return;
            }

            let comments = JSON.parse(localStorage.getItem(`comments_${code}`)) || [];
            
            const newComment = {
                name: nameInput.value.trim(),
                text: textInput.value.trim(),
                date: new Date().toLocaleDateString('tr-TR')
            };

            comments.push(newComment);
            localStorage.setItem(`comments_${code}`, JSON.stringify(comments));

            // Kutuları temizle ve yorumları yeniden yükle
            nameInput.value = "";
            textInput.value = "";
            loadReviews(code);
        }
    </script>
</body>
</html>
