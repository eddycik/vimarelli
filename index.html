<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div>
                    <span class="header-title">Vi Marélli</span>
                    <p class="header-subtitle">Lüks Parfüm Kodları</p>
                </div>
                <a href="https://www.instagram.com/vimarelli/" target="_blank" rel="noopener" class="instagram-link" aria-label="Vi Marelli Instagram">
                    <svg class="instagram-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>

    <main class="main">
        <div class="container">
            <section class="hero">

            <div class="hero-image">
                <img src="image/logo.jpg" alt="Vi Marélli Luxury Perfumes Logo" class="logo-img" loading="lazy">
            </div>

            <section class="search-section" aria-label="Arama ve Filtreleme">
                <div class="search-bar">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Örn: Tygar, Sauvage veya 1008..."

                </div>

                <div class="category-filters">
                    <button class="filter-btn active" data-category="all">Tümü <span class="filter-count" id="count-all">0</span></button>
                    <button class="filter-btn" data-category="Erkek">Erkek <span class="filter-count" id="count-erkek">0</span></button>
                    <button class="filter-btn" data-category="Kadın">Kadın <span class="filter-count" id="count-kadın">0</span></button>
                    <button class="filter-btn" data-category="Unisex">Unisex <span class="filter-count" id="count-unisex">0</span></button>

            <section id="products" class="products-section">
                <div id="productsContainer" class="products-container"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text">© <span id="currentYear">2026</span> Vi Marélli | Premium Muadil Parfüm Deneyimi</p>

    <script src="script.js"></script>
